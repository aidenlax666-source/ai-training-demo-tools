input_dir: samples/input
output_dir: samples/output

jobs:
  - name: csv_to_xlsx
    type: convert
    from: csv
    to: xlsx
    pattern: "*.csv"
    delimiter: ","
    sheet_name: "Sheet1"
    header: true
    encoding: auto

  - name: rename_exports
    type: rename
    pattern: "*.xlsx"
    prefix: "导出_"
    suffix: ""
    sequence: true
    sequence_start: 1
    source: output

